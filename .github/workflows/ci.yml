name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Build the sandbox image
        run: docker build -t watchdog-sandbox src/scorer/unit_tests
      - run: pytest
        env:
          REQUIRE_DOCKER: "1"
      - run: python3 -m src.probes.validate probes/*.jsonl